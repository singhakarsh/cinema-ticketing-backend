<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVerse Premium | Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #06060c;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }

        /* Nav Bar styling matching streaming theme */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 60px;
            position: absolute;
            width: 100%;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent);
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links span {
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .nav-links span:hover,
        .nav-links span.active {
            opacity: 1;
            color: #a55eea;
        }

        /* Immersive Banner Background */
        .hero-banner {
            height: 70vh;
            width: 100%;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 60px;
            transition: background-image 0.5s ease-in-out;
        }

        .hero-banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to right, rgba(6, 6, 12, 0.95) 20%, rgba(6, 6, 12, 0.3) 50%, rgba(6, 6, 12, 0.95) 90%),
                linear-gradient(to bottom, transparent 60%, #06060c 100%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 600px;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .hero-meta {
            font-size: 1rem;
            color: #26de81;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* Main Workspace Container */
        .main-content {
            padding: 0 60px 60px 60px;
            margin-top: -50px;
            position: relative;
            z-index: 3;
        }

        /* Movie Selection Section Slider */
        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .movie-slider {
            display: flex;
            gap: 24px;
            overflow-x: auto;
            padding: 20px 10px 30px 10px;
            /* Increased top/bottom padding so floating cards don't clip */
            margin-bottom: 40px;
            scroll-behavior: smooth;
        }

        .movie-slider::-webkit-scrollbar {
            height: 6px;
        }

        .movie-slider::-webkit-scrollbar-thumb {
            background: #2a2a40;
            border-radius: 10px;
        }

        .movie-card {
            min-width: 180px;
            max-width: 180px;
            height: 260px;
            border-radius: 12px;
            background-size: cover;
            background-position: center;
            cursor: pointer;

            /* High-performance hardware acceleration transitions */
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                border-color 0.4s ease,
                box-shadow 0.4s ease;

            border: 2px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-10px) scale(1.04);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6),
                0 0 20px rgba(255, 255, 255, 0.1);
        }

        .movie-card.active {
            border-color: #a55eea;
            transform: translateY(-8px) scale(1.04);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7),
                0 0 25px rgba(165, 94, 234, 0.45);
        }

        /* 1. The Booking Canvas Container - Sleek Glassmorphism look */
        .booking-workspace {
            background: linear-gradient(135deg, rgba(20, 20, 35, 0.65) 0%, rgba(10, 10, 20, 0.85) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            margin-top: 20px;
            position: relative;
        }

        /* 2. The Theater Screen Vector - Adds a realistic architectural curve */
        .theater-screen-glow {
            width: 70%;
            height: 4px;
            background: linear-gradient(to right, transparent, #a55eea, transparent);
            box-shadow: 0 0 20px #a55eea;
            border-radius: 50%;
            margin-bottom: 35px;
        }

        /* 3. The Active Showtime Text Header Banner */
        .showtime-banner {
            font-size: 0.95rem;
            font-weight: 600;
            color: #8e8e9f;
            letter-spacing: 0.5px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* 4. Luxury Seating Grid Layout */
        .seating-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
            align-items: center;
            width: 100%;
        }

        /* 2. Individual Seat Row Wrapper */
        .seat-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
        }

        /* 3. Row Label styling (A, B, C...) */
        .row-label {
            font-size: 0.9rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.3);
            width: 30px;
            text-align: center;
            text-transform: uppercase;
        }

        /* 5. The Seat Chairs - Deep Glass-metallic style buttons */
        /* 4. Luxury Seating Chairs - Deep metallic squares */
        .seat-btn {
            background: rgba(38, 222, 129, 0.08);
            color: #26de81;
            border: 1px solid rgba(38, 222, 129, 0.3);
            width: 54px;
            height: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .seat-btn:hover {
            background: #26de81;
            color: #06060c;
            box-shadow: 0 0 20px rgba(38, 222, 129, 0.5);
            transform: translateY(-2px);
        }

        /* Taken Seats - Clean matte look */
        .seat-btn.occupied {
            background: rgba(255, 71, 87, 0.06) !important;
            color: rgba(255, 71, 87, 0.35) !important;
            border: 1px solid rgba(255, 71, 87, 0.15) !important;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* 5. Custom Seat Status Legend Component */
        .seating-legend {
            display: flex;
            gap: 24px;
            margin-bottom: 35px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #8e8e9f;
            font-weight: 500;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .legend-dot.available {
            background: rgba(38, 222, 129, 0.1);
            border: 1px solid #26de81;
        }

        .legend-dot.occupied {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid #ff4757;
        }

        .control-panel {
            display: flex;
            gap: 20px;
        }

        /* 6. The Control Board Panel Action Button */
        .reset-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            opacity: 0.6;
            padding: 12px 26px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            opacity: 1;
            border-color: #ff4757;
            color: #ff4757;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.2);
        }

        .no-shows-msg {
            font-size: 1.1rem;
            color: #8e8e9f;
            font-style: italic;
            margin: 20px 0;
        }

        /* 🌟 Custom Toast Notification Container */
        .toast-container {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toast-card {
            background: linear-gradient(135deg, rgba(30, 30, 50, 0.75) 0%, rgba(15, 15, 30, 0.9) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 28px;
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;

            /* CSS Smooth Slide In/Out animations */
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            opacity: 0;
        }

        /* State class to slide the card into view */
        .toast-card.show {
            transform: translateX(0);
            opacity: 1;
        }

        /* 🌟 Custom Blur Overlay Backdrop */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(4, 4, 8, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* Active overlay class */
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 🌟 Custom Glassmorphic Modal Box */
        .confirm-modal {
            background: linear-gradient(135deg, rgba(25, 25, 45, 0.85) 0%, rgba(12, 12, 25, 0.95) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 30px 40px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);

            /* Pop-in scaling animation scaling state */
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.25);
        }

        .modal-overlay.active .confirm-modal {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .modal-text {
            font-size: 0.95rem;
            color: #8e8e9f;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* Modal action layout button row */
        .modal-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .modal-btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .modal-btn.cancel {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-btn.cancel:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .modal-btn.confirm-action {
            background: #ff4757;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
        }

        .modal-btn.confirm-action:hover {
            background: #ff6b81;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.4);
        }
    </style>
</head>

<body>

    <div class="toast-container" id="toast-wrapper"></div>
    <div class="modal-overlay" id="confirm-modal-overlay">
        <div class="confirm-modal">
            <div class="modal-title">🔄 Reset Seating Layout?</div>
            <div class="modal-text">Are you sure you want to wipe out all current active bookings for this specific film
                showtime? This action cannot be undone.</div>
            <div class="modal-actions">
                <button class="modal-btn cancel" id="modal-cancel-btn">Cancel</button>
                <button class="modal-btn confirm-action" id="modal-confirm-btn">Yes, Reset</button>
            </div>
        </div>
    </div>

    <div class="navbar">
        <div class="nav-links">
            <span class="active">DASHBOARD</span>
            <span>MOVIES</span>
            <span>SERIES</span>
            <span>KIDS</span>
        </div>
    </div>

    <div class="hero-banner" id="hero-bg">
        <div class="hero-content">
            <h1 class="hero-title" id="hero-title">Loading...</h1>
            <div class="hero-meta" id="hero-genre">Genre: --</div>
        </div>
    </div>

    <div class="main-content">
        <div class="section-title">MY LIST</div>
        <div class="movie-slider" id="movie-list-container"></div>

        <div class="section-title">BOOKING WORKSPACE</div>
        <div class="booking-workspace">
            <div class="theater-screen-glow"></div>
            <div class="showtime-banner" id="showtime-text">Checking Available Showtimes...</div>

            <div class="seating-legend">
                <div class="legend-item">
                    <div class="legend-dot available"></div>
                    <span>Available</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot occupied"></div>
                    <span>Occupied</span>
                </div>
            </div>

            <div class="seating-grid" id="seats-layout"></div>
            <div class="control-panel" id="control-panel"></div>
        </div>
    </div>

    <script>
        let currentActiveShowtimeId = null;

        // 1. Initial boot up cycle: Fetch all movies to build layout cards
        async function initApp() {
            try {
                const response = await fetch('/api/movies');
                const movies = await response.json();

                if (movies.length === 0) return;

                renderMovieCards(movies);
                // Default view maps directly onto our premier film (ID: 1)
                selectMovie(movies[0]);
            } catch (err) {
                console.error("Pipeline failure connecting to backend maps:", err);
            }
        }

        // 2. Render dynamic movie cards down into the horizontal scroll container
        function renderMovieCards(movies) {
            const container = document.getElementById('movie-list-container');
            container.innerHTML = '';

            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.id = `movie-card-${movie.id}`;
                card.style.backgroundImage = `url('${movie.posterUrl}')`;

                card.onclick = () => {
                    // Strip old active selections and establish new card outline
                    document.querySelectorAll('.movie-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    selectMovie(movie);
                };

                container.appendChild(card);
            });

            // Mark the very first item as visual active card baseline
            if (container.firstChild) container.firstChild.classList.add('active');
        }

        // 3. Main theme shifting pipeline step when card click event triggers
        async function selectMovie(movie) {
            // Update the giant immersive top background banner
            document.getElementById('hero-bg').style.backgroundImage = `url('${movie.bannerUrl}')`;
            document.getElementById('hero-title').innerText = movie.title;
            document.getElementById('hero-genre').innerText = `✨ ${movie.genre} | Language: ${movie.language} | 🕒 ${movie.durationMinutes} mins`;

            // Reset workspace view fields
            document.getElementById('seats-layout').innerHTML = '';
            document.getElementById('control-panel').innerHTML = '';
            currentActiveShowtimeId = null;

            // Call our new custom filtered backend query method!
            try {
                const response = await fetch(`/api/showtimes/movie/${movie.id}`);
                const showtimes = await response.json();

                if (showtimes.length === 0) {
                    document.getElementById('showtime-text').innerText = "🚫 No active showtimes available for this title today.";
                    return;
                }

                // If showtimes exist, grab the first scheduled layout option
                const activeShow = showtimes[0];
                currentActiveShowtimeId = activeShow.id;

                document.getElementById('showtime-text').innerText =
                    `⏰ Location: ${activeShow.screenName} | Price: ₹${activeShow.ticketPrice} | Showtime ID: ${activeShow.id}`;

                // Fetch real-time seat allocations for this specific showtime id
                await loadSeatsForShowtime(activeShow.id);
                renderResetControl(activeShow.id);
            } catch (err) {
                console.error("Error loading show schedules:", err);
            }
        }

        // 4. Fetch genuine PostgreSQL seat allocations for the active showtime
        async function loadSeatsForShowtime(showtimeId) {
            try {
                const response = await fetch(`/api/seats/showtime/${showtimeId}`);
                const seats = await response.json();
                renderSeats(seats);
            } catch (err) {
                console.error("Error fetching live seat records:", err);
            }
        }

        // 5. Paint sorted interactive seating array rows onto dashboard layout
        function renderSeats(seats) {
            const grid = document.getElementById('seats-layout');
            grid.innerHTML = '';

            // Group our seats array dynamically by their prefix row letter
            const rowsMap = {};
            seats.forEach(seat => {
                // If seatNumber is "A-1", split('-')[0] gives us "A"
                const rowLetter = seat.seatNumber.includes('-') ? seat.seatNumber.split('-')[0] : 'A';
                if (!rowsMap[rowLetter]) {
                    rowsMap[rowLetter] = [];
                }
                rowsMap[rowLetter].push(seat);
            });

            // Loop through each row in our sorted map and build a physical row row
            Object.keys(rowsMap).sort().forEach(rowLetter => {
                const rowWrapper = document.createElement('div');
                rowWrapper.className = 'seat-row';

                // Left row identifier label
                const leftLabel = document.createElement('div');
                leftLabel.className = 'row-label';
                leftLabel.innerText = rowLetter;
                rowWrapper.appendChild(leftLabel);

                // Append the chairs inside this row
                rowsMap[rowLetter].forEach(seat => {
                    const btn = document.createElement('button');
                    btn.className = 'seat-btn';

                    // Display just the number component on the chair face (e.g. "1" instead of "A-1")
                    const seatNumDisplay = seat.seatNumber.includes('-') ? seat.seatNumber.split('-')[1] : seat.seatNumber;
                    btn.innerText = seatNumDisplay;

                    if (seat.reserved === true || seat.reserved === "true") {
                        btn.classList.add('occupied');
                        btn.disabled = true;
                    }

                    btn.onclick = async () => {
                        const postResponse = await fetch(`/api/bookings/book/${seat.id}`, { method: 'POST' });
                        const resultText = await postResponse.text();

                        // 🌟 Replace alert(resultText); with this:
                        showToast(resultText);
                        await loadSeatsForShowtime(currentActiveShowtimeId);
                    };

                    rowWrapper.appendChild(btn);
                });

                // Right side row label for complete spatial balance
                const rightLabel = document.createElement('div');
                rightLabel.className = 'row-label';
                rightLabel.innerText = rowLetter;
                rowWrapper.appendChild(rightLabel);

                grid.appendChild(rowWrapper);
            });
        }

        // 6. Build the dynamic reset control utility
        function renderResetControl(showtimeId) {
            const panel = document.getElementById('control-panel');
            panel.innerHTML = '';

            const resetBtn = document.createElement('button');
            resetBtn.className = 'reset-btn';
            resetBtn.innerText = '🔄 Reset Show Layout';

            resetBtn.onclick = () => {
                const overlay = document.getElementById('confirm-modal-overlay');
                const cancelBtn = document.getElementById('modal-cancel-btn');
                const confirmBtn = document.getElementById('modal-confirm-btn');

                // 1. Reveal our sleek custom glass blur dialog container
                overlay.classList.add('active');

                // 2. Clear out old attached events to prevent multi-firing triggers
                cancelBtn.onclick = null;
                confirmBtn.onclick = null;

                // 3. Wire up the clean exit action handler
                cancelBtn.onclick = () => {
                    overlay.classList.remove('active');
                };

                // 4. Wire up the confirmed network cycle execution
                confirmBtn.onclick = async () => {
                    overlay.classList.remove('active'); // Pull down overlay view

                    try {
                        const response = await fetch(`/api/bookings/reset/${showtimeId}`, { method: 'PUT' });
                        const txt = await response.text();

                        // Show our custom sliding toast notification banner
                        showToast(txt);

                        // Force live layout update grid rendering state instantly
                        await loadSeatsForShowtime(showtimeId);
                    } catch (err) {
                        console.error("Failed to clear layout state indices:", err);
                    }
                };
            };

            panel.appendChild(resetBtn);
        }

        // Modern custom human-coded replacement for browser alerts
        function showToast(message) {
            const container = document.getElementById('toast-wrapper');

            // Create a physical card element on the fly
            const toast = document.createElement('div');
            toast.className = 'toast-card';
            toast.innerText = message;

            container.appendChild(toast);

            // Force a minor browser layout recalculation step to trigger the CSS transition
            setTimeout(() => {
                toast.classList.add('show');
            }, 50);

            // Automatically clean up the card and slide it back out after 4 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                // Remove the element from the DOM tree completely once slide-out completes
                setTimeout(() => {
                    toast.remove();
                }, 400);
            }, 4000);
        }

        // Initialize dashboard app tracking layout automatically
        window.onload = initApp;
    </script>
</body>

</html>
