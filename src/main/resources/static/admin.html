<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #06060c;
            color: #ffffff;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .admin-container {
            max-width: 1100px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .admin-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 20px;
        }

        .admin-header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #a55eea 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-header p {
            color: #8e8e9f;
            font-size: 0.95rem;
            margin-top: 5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 30px;
        }

        .admin-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #a55eea;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #8e8e9f;
            text-transform: uppercase;
        }

        .input-group input,
        .input-group select {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 16px;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            width: 100%;
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #a55eea;
            box-shadow: 0 0 15px rgba(165, 94, 234, 0.2);
        }

        .input-group input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .submit-btn {
            background: #a55eea;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .submit-btn:hover {
            background: #b36ff6;
            transform: translateY(-2px);
        }

        .nav-link {
            color: #8e8e9f;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Interactive Data Catalog Table View Elements */
        .catalog-section {
            margin-top: 10px;
        }

        .catalog-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            margin-top: 15px;
        }

        .catalog-table th,
        .catalog-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .catalog-table th {
            background: rgba(165, 94, 234, 0.08);
            color: #a55eea;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .catalog-table td {
            font-size: 0.95rem;
            color: #e2e2e2;
        }

        /* Production Utility Buttons */
        .action-btns {
            display: flex;
            gap: 10px;
        }

        .edit-btn {
            background: #fa8231;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .delete-btn {
            background: #eb3b5a;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .edit-btn:hover {
            background: #f7b731;
        }

        .delete-btn:hover {
            background: #ff5252;
        }

        .toast-container {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toast-card {
            background: linear-gradient(135deg, rgba(30, 30, 50, 0.85) 0%, rgba(15, 15, 30, 0.95) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 28px;
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            opacity: 0;
        }

        .toast-card.show {
            transform: translateX(0);
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="toast-container" id="toast-wrapper"></div>

    <div class="admin-container">
        <div class="admin-header" style="display: flex; justify-content: space-between; align-items: flex-end;">
            <div>
                <a href="/index.html" class="nav-link">← Back to Main Dashboard</a>
                <h1 style="margin-top: 15px;">Cinema Inventory Management</h1>
                <p>Add, edit, or delete film releases and schedule active theatre showtimes.</p>
            </div>
            <button id="logout-trigger-btn" class="edit-btn"
                style="background: #be2edd; padding: 10px 20px; font-weight: 700;">Secure Log Out</button>
        </div>

        <div class="form-grid">
            <div class="admin-card">
                <div class="card-title" id="form-mode-title">🎬 Add New Movie</div>
                <form id="movie-form">
                    <input type="hidden" id="edit-movie-id">
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label>Movie Title</label>
                        <input type="text" id="movie-title" required placeholder="e.g. Inception">
                    </div>
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label>Genre</label>
                        <input type="text" id="movie-genre" required placeholder="e.g. Sci-Fi / Action">
                    </div>
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label>Language</label>
                        <input type="text" id="movie-lang" required placeholder="e.g. English">
                    </div>
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label>Duration (Minutes)</label>
                        <input type="number" id="movie-duration" required placeholder="e.g. 148">
                    </div>
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label>Poster URL</label>
                        <input type="url" id="movie-poster" required placeholder="Vertical card image link">
                    </div>
                    <div class="input-group" style="margin-bottom: 15px;">
                        <label>Banner URL</label>
                        <input type="url" id="movie-banner" required placeholder="Horizontal background link">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button type="submit" id="movie-submit-btn" class="submit-btn" style="flex: 2;">Upload Movie
                            Title</button>
                        <button type="button" id="cancel-edit-btn" class="submit-btn"
                            style="background: #3e3e4f; display: none; flex: 1;">Cancel</button>
                    </div>
                </form>
            </div>

            <div class="admin-card">
                <div class="card-title">⏰ Schedule New Showtime</div>
                <form id="showtime-form">
                    <div class="input-group" style="margin-bottom: 15px;">
                        <label>Target Movie</label>
                        <select id="showtime-movie-select" required>
                            <option value="" disabled selected>Loading active titles...</option>
                        </select>
                    </div>
                    <div class="input-group" style="margin-bottom: 15px;">
                        <label>Auditorium / Screen Name</label>
                        <input type="text" id="showtime-screen" required
                            placeholder="e.g. Audi Screen 1 or IMAX Screen">
                    </div>
                    <div class="input-group" style="margin-bottom: 15px;">
                        <label>Start Date & Time</label>
                        <input type="datetime-local" id="showtime-start" required>
                    </div>
                    <div class="input-group" style="margin-bottom: 25px;">
                        <label>Admission Ticket Price (INR)</label>
                        <input type="number" id="showtime-price" required placeholder="e.g. 300">
                    </div>
                    <button type="submit" class="submit-btn" style="width: 100%;">Allocate & Generate Seats</button>
                </form>
            </div>
        </div>

        <div class="catalog-section">
            <h2 class="card-title" style="color: #ffffff; font-size: 1.3rem; margin-bottom: 5px;">🎞️ Live Movie Catalog
            </h2>
            <table class="catalog-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Genre</th>
                        <th>Language</th>
                        <th>Duration</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="catalog-table-body">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #8e8e9f;">Synchronizing catalog indices...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let moviesCacheMemoryPool = [];

        function showToast(message) {
            const container = document.getElementById('toast-wrapper');
            const toast = document.createElement('div');
            toast.className = 'toast-card';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 50);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        // Pulls movies from backend database and draws BOTH the selection elements and table rows simultaneously
        async function refreshAdminDataDashboard() {
            try {
                const response = await fetch('/api/movies');
                moviesCacheMemoryPool = await response.json();

                const select = document.getElementById('showtime-movie-select');
                const tbody = document.getElementById('catalog-table-body');

                select.innerHTML = '<option value="" disabled selected>Select a movie...</option>';
                tbody.innerHTML = '';

                if (moviesCacheMemoryPool.length === 0) {
                    select.innerHTML = '<option value="" disabled>No active movies found in database</option>';
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #8e8e9f;">🚫 No active movie records in storage. Create one above!</td></tr>';
                    return;
                }

                moviesCacheMemoryPool.forEach(movie => {
                    // 1. Populate Dropdown Options mapping values
                    const opt = document.createElement('option');
                    opt.value = movie.id;
                    opt.innerText = movie.title;
                    select.appendChild(opt);

                    // 2. Generate Interactive Table Rows dynamically
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td style="font-weight: 700; color: #ffffff;">${movie.title}</td>
                        <td>${movie.genre}</td>
                        <td>${movie.language}</td>
                        <td>${movie.durationMinutes} Mins</td>
                        <td>
                            <div class="action-btns">
                                <button class="edit-btn" onclick="activateFormEditMode(${movie.id})">Edit</button>
                                <button class="delete-btn" onclick="executeMovieDeletion(${movie.id})">Delete</button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error("Dashboard engine synchronization breakdown error:", err);
            }
        }

        // Triggers Edit Mode and fills form layout data entries completely
        function activateFormEditMode(movieId) {
            const targetMovie = moviesCacheMemoryPool.find(m => m.id === movieId);
            if (!targetMovie) return;

            document.getElementById('edit-movie-id').value = targetMovie.id;
            document.getElementById('movie-title').value = targetMovie.title;
            document.getElementById('movie-genre').value = targetMovie.genre;
            document.getElementById('movie-lang').value = targetMovie.language;
            document.getElementById('movie-duration').value = targetMovie.durationMinutes;
            document.getElementById('movie-poster').value = targetMovie.posterUrl;
            document.getElementById('movie-banner').value = targetMovie.bannerUrl;

            document.getElementById('form-mode-title').innerText = "✍️ Edit Movie Details";
            document.getElementById('movie-submit-btn').innerText = "Save Changes";
            document.getElementById('movie-submit-btn').style.background = "#fa8231";
            document.getElementById('cancel-edit-btn').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelAndClearFormState() {
            document.getElementById('movie-form').reset();
            document.getElementById('edit-movie-id').value = '';
            document.getElementById('form-mode-title').innerText = "🎬 Add New Movie";
            document.getElementById('movie-submit-btn').innerText = "Upload Movie Title";
            document.getElementById('movie-submit-btn').style.background = "#a55eea";
            document.getElementById('cancel-edit-btn').style.display = "none";
        }

        document.getElementById('cancel-edit-btn').onclick = cancelAndClearFormState;

        // Unified Movie Submission Engine: Seamlessly decides between POST and PUT requests
        document.getElementById('movie-form').onsubmit = async (e) => {
            e.preventDefault();
            const activeEditId = document.getElementById('edit-movie-id').value;

            const payload = {
                title: document.getElementById('movie-title').value,
                genre: document.getElementById('movie-genre').value,
                language: document.getElementById('movie-lang').value,
                durationMinutes: parseInt(document.getElementById('movie-duration').value),
                posterUrl: document.getElementById('movie-poster').value,
                bannerUrl: document.getElementById('movie-banner').value
            };

            const targetUrl = activeEditId ? `/api/admin/movies/${activeEditId}` : '/api/admin/movies';
            const HTTPMethod = activeEditId ? 'PUT' : 'POST';

            const response = await fetch(targetUrl, {
                method: HTTPMethod,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                showToast(activeEditId ? "🚀 Movie record properties updated successfully!" : "🚀 Movie catalog expanded successfully!");
                cancelAndClearFormState();
                await refreshAdminDataDashboard();
            } else {
                showToast("❌ Server processing error during object serialization mapping.");
            }
        };

        // Complete Cascading Eraser Execution Method
        async function executeMovieDeletion(movieId) {
            const warningPrompt = confirm("⚠️ WARNING: Deleting this movie will instantly destroy all scheduled showtimes and reserved seating matrix structures. Continue?");
            if (!warningPrompt) return;

            const response = await fetch(`/api/admin/movies/${movieId}`, { method: 'DELETE' });

            if (response.ok) {
                showToast("🗑️ Movie wiped from infrastructure systems successfully.");
                await refreshAdminDataDashboard();
            } else {
                showToast("❌ Processing exception clearing storage records.");
            }
        }

        // Showtime Submission Allocation Flow Logic
        document.getElementById('showtime-form').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                movieId: parseInt(document.getElementById('showtime-movie-select').value),
                screenName: document.getElementById('showtime-screen').value,
                startTime: document.getElementById('showtime-start').value,
                ticketPrice: parseFloat(document.getElementById('showtime-price').value)
            };

            const response = await fetch('/api/admin/showtimes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const txt = await response.text();
            showToast(txt);
            if (response.ok) { document.getElementById('showtime-form').reset(); }
        };

        document.addEventListener("DOMContentLoaded", refreshAdminDataDashboard);

        // Append this action inside your script block to enable clear-out requests
        document.getElementById('logout-trigger-btn').onclick = async () => {
            const response = await fetch('/api/auth/logout', { method: 'POST' });
            if (response.ok) {
                window.location.href = '/login.html';
            }
        };
    </script>
</body>

</html>
